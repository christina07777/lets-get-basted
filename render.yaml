services:
  - type: web
    name: lets-get-basted
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lets-get-basted-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
databases:
  - name: lets-get-basted-db
    plan: free
