<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hosts · Let’s Get Basted!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Playfair+Display:ital,wght@1,700&display=swap">
<link rel="stylesheet" href="/brand.css">
<style>
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin:var(--space-4) 0}
  .stat{background:var(--cranberry-800);border-radius:var(--radius-md);padding:12px 8px;text-align:center}
  .stat b{display:block;font:900 28px/1 var(--display);color:var(--gold-500)}
  .entry{background:rgba(92,22,40,.55);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:8px;text-align:left}
  .entry .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .entry p{margin:4px 0 0}
  .x{background:none;border:1px solid rgba(255,143,134,.6);color:var(--coral);border-radius:var(--radius-pill);font:700 13px var(--display);padding:6px 12px;cursor:pointer;min-height:36px}
  h2.label-caps{margin:var(--space-8) 0 var(--space-3)}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <div class="center"><p class="eyebrow">Hosts only</p><h1 class="page-title">Party Dashboard</h1><p class="small"><a href="/whos-coming">Public “Who’s Coming” page →</a> · <a href="https://open.spotify.com/playlist/4Jliu98VSWwL240daEYfdh?si=YrcpM2NNQI-tC5Nm0pTx6A&amp;utm_source=copy-link&amp;pi=lNPE8MlIQRyb_&amp;pt=00809f64f69d12973f7eb3c48cab9ec9" target="_blank" rel="noopener">Party playlist →</a></p></div>

    <form id="login" style="margin-top:var(--space-6)">
      <div class="field"><label for="key">Host key</label><input type="text" id="key" autocomplete="off" placeholder="The ADMIN_KEY you set on Render"></div>
      <button class="btn btn-primary btn-block">Open dashboard</button>
    </form>
    <p class="error center" id="err" role="alert"></p>

    <div id="dash" class="hidden">
      <div class="stats">
        <div class="stat"><b id="s-guests">0</b><span class="small">guests coming</span></div>
        <div class="stat"><b id="s-items">0</b><span class="small">dishes claimed</span></div>
        <div class="stat"><b id="s-chairs">0</b><span class="small">chairs pledged</span></div>
        <div class="stat"><b id="s-don">$0</b><span class="small">donations pledged</span></div>
      </div>
      <button class="btn btn-secondary btn-block" id="copy">Copy everything as text</button>

      <h2 class="label-caps">RSVPs</h2><div id="rsvps"></div>
      <h2 class="label-caps">Potluck claims</h2><div id="claims"></div>
      <h2 class="label-caps">Donations (private)</h2><div id="dons"></div>
      <h2 class="label-caps">Quantities (goal for <span id="hc">30</span> guests)</h2><div id="chairs"></div>
      <h2 class="label-caps">Fill-in items</h2><div id="extras"></div>
      <h2 class="label-caps">Comments</h2><div id="msgs"></div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let key = sessionStorage.getItem("basted-key") || "", data = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "x-admin-key": key } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
async function load() {
  try {
    data = await api("/api/admin");
    sessionStorage.setItem("basted-key", key);
    $("#login").classList.add("hidden"); $("#dash").classList.remove("hidden"); $("#err").textContent = "";
    render();
  } catch (e) { $("#err").textContent = e.message; }
}
function render() {
  $("#msgs").innerHTML = (data.messages || []).map((m) => `<div class="entry"><div class="top"><div><b>${esc(m.name)}</b>
      ${m.excited ? `<p class="small">Excited: ${esc(m.excited)}</p>` : ""}${m.thankful ? `<p class="small">Thankful: ${esc(m.thankful)}</p>` : ""}</div>
      <button class="x" data-del-msg="${m.id}">Remove</button></div></div>`).join("") || `<p class="small">No comments yet.</p>`;
  $("#s-guests").textContent = data.guests; $("#s-chairs").textContent = data.chairs;
  $("#s-items").textContent = `${data.claimedSlots}/${data.totalItems}`;
  $("#rsvps").innerHTML = data.rsvps.map((r) => `<div class="entry"><div class="top"><div>
      <b>${esc(r.name)}</b> ${r.attending ? `<span class="success">· coming (${r.party_size || "?"})</span>` : `<span class="muted">· can’t make it</span>`}
      ${r.guest_names ? `<p class="small">${esc(r.guest_names)}</p>` : ""}
      ${[r.phone, r.email].filter(Boolean).length ? `<p class="small">${[r.phone, r.email].filter(Boolean).map(esc).join(" · ")}</p>` : ""}
      ${r.notes ? `<p class="small">Note: ${esc(r.notes)}</p>` : ""}</div>
      <button class="x" data-del-rsvp="${r.id}">Remove</button></div></div>`).join("") || `<p class="small">No RSVPs yet.</p>`;
  $("#claims").innerHTML = data.claims.map((c) => `<div class="entry"><div class="top"><div><b>${esc(c.item)}</b> — ${esc(c.name)}
      ${c.contact ? `<p class="small">${esc(c.contact)}</p>` : ""}</div><button class="x" data-unclaim="${esc(c.item)}">Release</button></div></div>`).join("") || `<p class="small">Nothing claimed yet.</p>`;
  $("#s-don").textContent = `$${data.donations || 0}`;
  $("#dons").innerHTML = data.extras.filter((x) => x.category === "Donation").map((x) => `<div class="entry"><div class="top"><div><b>$${esc(x.dish)}</b> — ${esc(x.name)}${x.contact ? `<p class="small">${esc(x.contact)}</p>` : ""}</div>
      <button class="x" data-del-extra="${x.id}">Remove</button></div></div>`).join("") || `<p class="small">No donations pledged yet.</p>`;
  $("#hc").textContent = data.headcount;
  $("#chairs").innerHTML = data.counts.map((c) => `<div class="entry"><b>${esc(c.item)}</b> <span class="${c.total >= c.goal ? "success" : "muted"}">· ${c.total} of ${c.goal} ${esc(c.unit)}</span>
      ${c.pledges.map((x) => `<div class="top" style="margin-top:6px"><p class="small" style="margin:0">${esc(x.name)}: ${x.qty}${x.contact ? ` · ${esc(x.contact)}` : ""}</p>
        <button class="x" data-del-extra="${x.id}">Remove</button></div>`).join("")}</div>`).join("");
  $("#extras").innerHTML = data.extras.filter((x) => !data.countItems.includes(x.category) && x.category !== "Donation").map((x) => `<div class="entry"><div class="top"><div><b>${x.category === "Folding chairs" ? `${esc(x.dish)} folding chair(s)` : esc(x.dish)}</b> — ${esc(x.name)}${x.category ? `<p class="small">${esc(x.category)}${x.contact ? ` · ${esc(x.contact)}` : ""}</p>` : ""}</div>
      <button class="x" data-del-extra="${x.id}">Remove</button></div></div>`).join("") || `<p class="small">None yet.</p>`;
}
$("#login").addEventListener("submit", (e) => { e.preventDefault(); key = $("#key").value.trim(); load(); });
document.addEventListener("click", async (e) => {
  const t = e.target;
  try {
    if (t.dataset.delRsvp && confirmInline(t)) await api(`/api/admin/rsvp/${t.dataset.delRsvp}`, { method: "DELETE" });
    else if (t.dataset.unclaim && confirmInline(t)) await api(`/api/admin/claim`, { method: "DELETE", body: JSON.stringify({ item: t.dataset.unclaim }) });
    else if (t.dataset.delMsg && confirmInline(t)) await api(`/api/admin/message/${t.dataset.delMsg}`, { method: "DELETE" });
    else if (t.dataset.delExtra && confirmInline(t)) await api(`/api/admin/extra/${t.dataset.delExtra}`, { method: "DELETE" });
    else return;
    load();
  } catch (err) { $("#err").textContent = err.message; }
});
// Two-tap confirm (no pop-up dialogs)
function confirmInline(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = "Tap again";
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 3000);
  return false;
}
$("#copy").addEventListener("click", async () => {
  const L = ["LET’S GET BASTED! — Friendsgiving Potluck", `Guests coming: ${data.guests} · Chairs: ${data.chairs}`, "", "RSVPs:"];
  data.rsvps.forEach((r) => L.push(`- ${r.name}: ${r.attending ? `coming (${r.party_size || "?"})` : "can’t make it"}${r.guest_names ? ` — ${r.guest_names}` : ""}${r.phone ? ` · ${r.phone}` : ""}${r.email ? ` · ${r.email}` : ""}${r.notes ? ` · Note: ${r.notes}` : ""}`));
  L.push("", `Quantities (goals for ${data.headcount} guests):`); data.counts.forEach((c) => L.push(`- ${c.item}: ${c.total}/${c.goal} ${c.unit}${c.pledges.length ? " — " + c.pledges.map((x) => `${x.name} (${x.qty})`).join(", ") : ""}`));
  L.push("", "Potluck:"); data.claims.forEach((c) => L.push(`- ${c.item} — ${c.name}`));
  const fill = data.extras.filter((x) => !data.countItems.includes(x.category) && x.category !== "Donation");
  L.push("", `Donations pledged: $${data.donations || 0}`); data.extras.filter((x) => x.category === "Donation").forEach((x) => L.push(`- ${x.name}: $${x.dish}${x.contact ? ` (${x.contact})` : ""}`));
  if (fill.length) { L.push("", "Extras:"); fill.forEach((x) => L.push(x.category === "Folding chairs" ? `- ${x.dish} folding chair(s) — ${x.name}` : `- ${x.dish} — ${x.name}${x.category ? ` (${x.category})` : ""}`)); }
  try { await navigator.clipboard.writeText(L.join("\n")); $("#copy").textContent = "Copied!"; } catch (e) { $("#copy").textContent = "Couldn’t copy"; }
  setTimeout(() => ($("#copy").textContent = "Copy everything as text"), 2500);
});
if (key) load();
</script>
</body>
</html>
